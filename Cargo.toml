[package]
name = "armature-cache"
version = "0.4.1"
edition = "2024"
rust-version = "1.94.1"
autobenches = false  # Disable auto-discovery, use explicit [[bench]] only
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-cache"
homepage = "https://quinnjr.github.io/armature"
description = "Cache management for Armature framework with Redis and in-memory support"
keywords = ["cache", "redis", "memory", "distributed"]
categories = ["caching", "web-programming"]

[dependencies]
# Logging
armature-log = { version = "0.2" }

# Core dependencies
async-trait = "0.1"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"

# Redis support (optional) - uses armature-redis for DI integration
armature-redis = { version = "0.2", optional = true }
redis = { version = "1.7", features = ["tokio-comp", "connection-manager"], optional = true }

# Memcached support (optional) - TLS disabled to avoid openssl dependency
# For TLS support, users can enable "memcached-tls" feature
memcache = { version = "0.21", optional = true, default-features = false }

[features]
# Note: memcached removed from default due to enum_dispatch minimal-versions issues
default = ["redis"]
redis = ["dep:redis", "armature-redis"]
memcached = ["dep:memcache"]
memcached-tls = ["memcache/tls"]  # Requires openssl

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }

# Docker-gated container helpers for integration tests. The tests self-skip when
# no Docker daemon is reachable, so the default `cargo test` never needs Docker.
armature-testkit = { path = "../armature-testkit", features = ["containers"] }
# Used by the memcached increment integration test to spin a throwaway
# `memcached` container (testcontainers-modules has no memcached module).
testcontainers = "0.27.3"

# Explicit bench targets only: a stray file under benches/ should not silently
# become a target.
[[bench]]
name = "cache"
harness = false
